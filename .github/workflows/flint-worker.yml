name: Publish flint-worker image

# Builds the consolidated FLINT + radio-tools + Dask/Jupyter image and publishes
# it to GHCR for use as:
#   - a JupyterHub singleuser image, and
#   - a dask-kubernetes operator worker/scheduler image.
#
# NOTE on package visibility: GHCR packages are created PRIVATE on first publish.
# After the first successful run, make the `flint-worker` package public once via
# the package settings UI (Packages -> flint-worker -> Package settings ->
# Change visibility -> Public), or with:
#   gh api -X PATCH /user/packages/container/flint-worker/visibility \
#     -f visibility=public
# (token needs the `write:packages` scope).

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "Dockerfile-flint-worker"
      - ".github/workflows/flint-worker.yml"
      - "calibrate/**"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: flint-worker

jobs:
  build-and-push:
    name: Build and push flint-worker
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out the repo (with submodules)
        uses: actions/checkout@v4
        with:
          # calibrate is a public submodule, so the default GITHUB_TOKEN is
          # sufficient; no CALIBRATE_TOKEN secret is required in forks.
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-flint-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
